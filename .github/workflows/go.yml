name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - if: runner.os == 'Windows'
        name: Build controlled native producer
        run: |
          ./scripts/build-native.ps1 -Output "$env:RUNNER_TEMP/ap-native"
          "AP_NATIVE_LAB=$env:RUNNER_TEMP/ap-native/APNativeLab.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - if: runner.os == 'Linux'
        name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal experiments)
          if [ -n "$unformatted" ]; then
            gofmt -d cmd internal experiments
            exit 1
          fi
      - run: go test -v -timeout=120s ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - if: runner.os == 'Linux'
        run: go test -race ./...

      - if: runner.os == 'Windows'
        name: Native event producer integration
        run: ./scripts/test-native.ps1

      - if: runner.os == 'Windows'
        name: Controlled x64 code and unwind
        run: go test -v -count=1 -timeout=30s ./internal/instrumentation/x64 -run 'Test(ControlledNativeTrampolineAndRestore|NativeCallProbesABIAndVirtualUnwind|NativePELeafUnwindEligibility|NativeProbeReportsSameEntryStackWithoutChangingArguments)$'

      - if: runner.os == 'Windows'
        name: Controlled ETW integration
        env:
          AP_ETW_INTEGRATION: '1'
        run: go test -v -count=1 -timeout=45s ./internal/platform -run TestETWControlledWorkload

      - if: runner.os == 'Windows'
        name: Reviewed original Delphi routines
        run: ./scripts/test-reference-delphi.ps1

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Reference-Delphi-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ap-reference-delphi/reference-delphi.json
            ${{ runner.temp }}/ap-reference-delphi/reference-delphi-exceptions.json
            ${{ runner.temp }}/ap-reference-delphi/reference-delphi-metrics.ndjson
          if-no-files-found: error

      - if: runner.os == 'Windows'
        name: Controlled native cost measurement
        env:
          AP_NATIVE_COST: '1'
          AP_NATIVE_COST_REPORT: ${{ runner.temp }}/native-cost.ndjson
          AP_NATIVE_LOAD_COST_REPORT: ${{ runner.temp }}/native-load-cost.ndjson
        run: go test -v -count=1 -timeout=45s ./internal/instrumentation/native -run '^TestNativeCost'

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Native-cost-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-cost.ndjson
            ${{ runner.temp }}/native-load-cost.ndjson
          if-no-files-found: error

      - if: runner.os == 'Windows'
        name: Native viewer smoke
        env:
          AP_GUI_SMOKE: '1'
        run: go test -v -count=1 -timeout=30s ./internal/desktop -run 'TestNative.*WindowSmoke'

      - if: runner.os == 'Windows'
        name: Native thread reuse, memory and saturation
        id: native-stress
        env:
          AP_NATIVE_STRESS: '1'
          AP_NATIVE_STRESS_REPORT: ${{ runner.temp }}/native-stress.ndjson
          AP_NATIVE_RESOURCE_REPORT: ${{ runner.temp }}/native-resources.json
        run: go test -v -count=1 -timeout=90s ./internal/instrumentation/native -run '^TestNativeStress'

      - if: runner.os == 'Windows' && always() && (steps.native-stress.outcome == 'success' || steps.native-stress.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: Native-stress-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-stress.ndjson
            ${{ runner.temp }}/native-resources.json
          if-no-files-found: error

      - if: runner.os == 'Windows'
        name: Windows executable end-to-end
        run: ./scripts/test-windows-e2e.ps1

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AntiPessimizer-Windows-amd64
          path: dist/
          if-no-files-found: error
