name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - if: runner.os == 'Linux'
        run: go test -race ./...

      - if: runner.os == 'Windows'
        name: Controlled ETW integration
        env:
          AP_ETW_INTEGRATION: '1'
        run: go test -v -count=1 -timeout=45s ./internal/platform -run TestETWControlledWorkload

      - if: runner.os == 'Windows'
        name: Native viewer smoke
        env:
          AP_GUI_SMOKE: '1'
        run: go test -v -count=1 -timeout=30s ./internal/desktop -run TestNativeWindowSmoke
