name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - if: runner.os == 'Linux'
        run: go test -race ./...

      - if: runner.os == 'Windows'
        name: Controlled x64 trampoline execution
        run: go test -v -count=1 -timeout=30s ./internal/instrumentation/x64 -run TestControlledNativeTrampolineAndRestore

      - if: runner.os == 'Windows'
        name: Controlled ETW integration
        env:
          AP_ETW_INTEGRATION: '1'
        run: go test -v -count=1 -timeout=45s ./internal/platform -run TestETWControlledWorkload

      - if: runner.os == 'Windows'
        name: Native viewer smoke
        env:
          AP_GUI_SMOKE: '1'
        run: go test -v -count=1 -timeout=30s ./internal/desktop -run 'TestNative.*WindowSmoke'

      - if: runner.os == 'Windows'
        name: Windows executable end-to-end
        run: ./scripts/test-windows-e2e.ps1

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AntiPessimizer-Windows-amd64
          path: dist/
          if-no-files-found: error
